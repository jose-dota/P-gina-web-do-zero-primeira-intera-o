<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog de comidinha</title>
        <style> 
            header {
                background-color: #331818;
                color: rgb(255, 255, 255);
                text-align: center;
                padding: 20px;
            }
            main {
                background-color: rgb(83, 29, 7);
                color: rgb(255, 255, 255);
                max-width: 2000px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
                align-items: center;
                gap: 16px;
            }
            img {
                width: 300px;
                height: 300px;
                object-fit: cover;
                border-radius: 8px;
            }
            .artigo-autor{
                font-weight: bold;
            }
            .content {
                text-align: left;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Meu blog de receitas</h1>
            <p>Vou compartilhar conhecimentos sobre minhas receitas pessoais</p>
        </header>
        <main>
                <img src="jose.jpg" alt="Bolos e brownies do blog">
                <div class="content">
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: José C.</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de culinária e curiosidades da área de gastronomia pessoal.</p>
                <button>🧁<span>0</span></button>
                <button>🍪<span>0</span></button>
            </div>
        </main>
    </body>
    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach( function(botao){
            botao.addEventListener("click", botaoClicado);

            function botaoClicado(){
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                texto.textContent++;
            }
        })

    </script>
</html>
